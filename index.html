<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rik's Custom Code Studio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-top: 0; font-size: 24px; }
        p { color: #94a3b8; font-size: 14px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 13px; color: #cbd5e1; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 6px; box-sizing: border-box; }
        textarea { width: 100%; height: 200px; background: #0f172a; color: #38bdf8; border: 1px solid #334155; padding: 12px; font-family: 'Courier New', Courier, monospace; font-size: 14px; border-radius: 6px; margin-top: 5px; box-sizing: border-box; resize: vertical; }
        .preview-box { background: #0f172a; border: 1px dashed #334155; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; color: #f43f5e; max-height: 100px; overflow-y: auto; margin-top: 5px; word-break: break-all; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; margin-top: 20px; border-radius: 6px; width: 100%; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔒 Custom Code Maker</h1>
        <p>Type your script below. It gets automatically converted into your own private file format!</p>
        
        <label for="codeInput">Source Code:</label>
        <textarea id="codeInput" placeholder="print('Hello!')" oninput="updatePreview()"></textarea>
        
        <label for="fileName">File Name:</label>
        <input type="text" id="fileName" value="myscript" placeholder="Enter file name">

        <label>Live Encrypted Preview (What the file actually looks like inside):</label>
        <div id="previewBox" class="preview-box">CUSTOM_ENC_V1::...</div>

        <button onclick="generateCustomFile()">Download Custom File (.enc)</button>
    </div>

    <div class="footer">Custom Code Studio • Powered by GitHub Pages</div>

    <script>
        function getEncodedContent() {
            let code = document.getElementById('codeInput').value;
            if (!code) return "CUSTOM_ENC_V1::";
            let encodedCode = btoa(unescape(encodeURIComponent(code)));
            return "CUSTOM_ENC_V1::" + encodedCode;
        }

        function updatePreview() {
            document.getElementById('previewBox').innerText = getEncodedContent();
        }

        function generateCustomFile() {
            let code = document.getElementById('codeInput').value;
            let customName = document.getElementById('fileName').value.trim() || "script";

            if (!code) {
                alert("Please type some code first!");
                return;
            }

            let finalFileContent = getEncodedContent();

            // Maakt automatisch een download aan met jouw vaste eigen extensie (.enc)
            let blob = new Blob([finalFileContent], { type: "text/plain" });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = customName + ".enc"; // Vaste eigen extensie!
            link.click();
        }
    </script>

</body>
</html>

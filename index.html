<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Code Encoder (.enc)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1e1e1e; color: #fff; padding: 30px; }
        textarea { width: 100%; height: 250px; background: #2d2d2d; color: #0ff; border: 1px solid #444; padding: 10px; font-family: monospace; font-size: 14px; }
        button { background: #007acc; color: white; border: none; padding: 12px 20px; font-size: 16px; cursor: pointer; margin-top: 10px; border-radius: 5px; }
        button:hover { background: #005999; }
    </style>
</head>
<body>

    <h1>🔒 Anti-Steal Code Encoder</h1>
    <p>Paste your Python code below. The website will convert it into a secure <code>.enc</code> file that is unreadable to thieves, but still fully functional in your app!</p>
    
    <textarea id="codeInput" placeholder="print('Hello World!')"></textarea><br>
    <button onclick="generateEncFile()">Download .enc File</button>

    <script>
        function generateEncFile() {
            let code = document.getElementById('codeInput').value;
            if (!code) {
                alert("Please type some code first!");
                return;
            }

            // Step A: Encode the code to Base64 (making it unreadable text)
            let encodedCode = btoa(unescape(encodeURIComponent(code)));
            
            // Add a custom header so it looks like your own unique file format
            let customFileContent = "CUSTOM_ENC_V1::" + encodedCode;

            // Step B: Create a virtual file and trigger the download
            let blob = new Blob([customFileContent], { type: "text/plain" });
            let link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "script.enc"; // The name of the protected file
            link.click();
        }
    </script>

</body>
</html>
